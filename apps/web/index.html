<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>ParaDOCs</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="Self-hosted document management" />
    <script>
      // Apply the saved theme before first paint so there is no wrong-theme flash.
      // The app stores this with JSON.stringify, so the value arrives quoted.
      // In the desktop app the app's own copy wins; it is shared by every server.
      (function () {
        var desktop = window.paradocsDesktop;
        var saved = desktop && desktop.preferences && desktop.preferences.initial.theme;
        var raw = saved ? JSON.stringify(saved) : localStorage.getItem('paradocs.theme');
        var t = 'system';
        try {
          t = raw ? JSON.parse(raw) : 'system';
        } catch (e) {
          t = raw || 'system';
        }
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
