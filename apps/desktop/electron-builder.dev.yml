# Test builds of the dev branch, which the release workflow builds with
# `--config electron-builder.dev.yml`. Everything else comes from
# electron-builder.yml.
extends: ./electron-builder.yml

# Its own app, so it installs beside the released one rather than over it, and
# keeps its settings and servers apart.
appId: com.paradocs.desktop.dev
productName: ParaDOCs Dev

# No update channel: without app-update.yml the updater turns itself off, so a
# test build is never offered the release it was built after.
publish: null
