appId: com.paradocs.desktop
# Stated explicitly: electron lives in the workspace root's node_modules, where
# electron-builder's own lookup does not find it.
electronVersion: 44.4.0
productName: ParaDOCs
copyright: Copyright © ParaDOCs contributors

directories:
  output: release
  buildResources: build

# Where the app looks for updates. Building with a publish target is what writes
# app-update.yml into the package and latest*.yml beside the artifacts; without
# them the app disables updates rather than reporting an error each launch.
#
# A fork should point these at its own repository. A deployment that would
# rather not depend on GitHub can ignore this and point the app at any static
# directory holding the artifacts and their latest*.yml, with
# PARADOCS_UPDATE_URL.
publish:
  - provider: github
    owner: ParadoxRelativity
    repo: ParaDOCs

# The main process is bundled into dist/, so only that, the package manifest and
# the few dependencies that cannot be bundled need to ship.
files:
  - dist/**
  - package.json
  - '!**/*.map'

# PGlite reads its wasm and extension archives from disk and jsdom spawns a
# worker from its own directory, so neither can be served from inside the asar.
asarUnpack:
  - node_modules/@electric-sql/pglite/**
  - node_modules/jsdom/**

mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Hardened runtime is required for notarisation. The JIT entitlement is what
  # lets Chromium and PGlite's WebAssembly run under it.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
  # Electron 39 and later require this for desktopCapturer, which the screen
  # share picker uses, even though system audio is only captured on Windows.
  extendInfo:
    NSAudioCaptureUsageDescription: ParaDOCs shares your screen in calls when you choose to.

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  icon: build/icon.ico
  # x64 only. Listing several architectures makes electron-builder emit a
  # combined installer alongside the per-architecture ones, and latest.yml then
  # points updates at that combined file — roughly double the download for every
  # user. x64 runs on ARM Windows under emulation; native arm64 can be added
  # later by building each architecture in its own invocation.
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
  shortcutName: ParaDOCs

linux:
  icon: build/icon.png
  category: Office
  target:
    - AppImage
