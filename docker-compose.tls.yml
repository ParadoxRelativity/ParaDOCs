# TLS overlay: puts Caddy in front and obtains certificates automatically.
#
#   # in .env
#   DOMAIN=docs.example.com
#   BIND_ADDR=127.0.0.1     # keeps the app off the public interface
#
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d --build
#
# Point the domain's A/AAAA record at this host first, or the certificate order
# will fail. Compose merges published ports rather than replacing them, so the
# app's own binding is narrowed with BIND_ADDR instead of being removed here.
#
# With voice as well:
#
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml \
#     --profile voice up -d --build
#
# and set LIVEKIT_BIND=127.0.0.1 so only Caddy can reach the signalling port.
# The UDP media range stays published: it is dialled by browsers directly.

services:
  app:
    environment:
      # Cookies must be marked Secure once traffic is HTTPS.
      SECURE_COOKIES: 'true'
      # A page served over https may only open wss://, so voice has to be
      # addressed through Caddy rather than at the container's own port.
      # Caddy proxies LiveKit's /rtc and /twirp paths on this same domain.
      LIVEKIT_URL: ${LIVEKIT_URL:-wss://${DOMAIN}}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN to the hostname this is served on}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - '80:80'
      - '443:443'

volumes:
  caddy-data:
  caddy-config:
