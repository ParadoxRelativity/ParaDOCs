# LiveKit server for ParaDOCs voice and video channels.
#
# Started only with the `voice` compose profile:
#     docker compose --profile voice up -d
#
# Keys are not written here — they come from LIVEKIT_KEYS in the environment, so
# the secret lives in .env alongside the others rather than in a file that is
# easy to commit by accident.
port: 7880

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  # The container cannot discover the address browsers use to reach it, so
  # LIVEKIT_NODE_IP is passed on the command line instead of guessed.
  use_external_ip: false

# Rooms are created on demand when the first person joins and disappear once
# the last one leaves, which is why an empty voice channel costs nothing.
room:
  auto_create: true
  empty_timeout: 60

logging:
  level: info
