# Cuts a release from a version tag.
#
# Pushing `vX.Y.Z` runs the Build workflow (build.yml) for the desktop app on
# each platform, the Android app and the server image, then uploads the
# installers, together with the latest*.yml manifests the auto-updater reads,
# and the APK to a DRAFT GitHub Release. Publishing that draft is a deliberate
# second step, because publishing is what makes every installed client start
# updating. The server image is pushed as X.Y.Z, X.Y and latest by the build
# itself.
#
# Test builds of the dev branch are not made here but by the Dev build
# workflow (dev-build.yml), which never has the right to create a release.
name: Release

on:
  push:
    tags: ['v*']
  # Lets a build be exercised without tagging. Artifacts are still uploaded to a
  # draft, so this is safe to run against main. It refuses to run against dev.
  workflow_dispatch:

permissions:
  contents: read

# Releases always finish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      channel: release
    secrets: inherit
    permissions:
      contents: read
      packages: write # the server image

  release:
    name: Upload to draft release
    # Waits for the whole build, so a draft never holds half a release. If one
    # platform fails, re-running it re-runs this job too.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release
          merge-multiple: true

      # An update manifest missing from the release is the other quiet failure:
      # that platform's installed clients would simply never update.
      - name: Check update manifests
        shell: bash
        run: |
          ls -la release
          for f in latest.yml latest-mac.yml; do
            [ -f "release/$f" ] || { echo "::error::release/$f is missing."; exit 1; }
          done

      # The only step that creates a release, so there is exactly one per tag.
      # A draft left by an earlier run of the same version is reused, and
      # --clobber replaces its files, so re-running is safe.
      - name: Create or reuse draft and upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.build.outputs.version }}
        run: |
          count="$(gh api --paginate "repos/$GH_REPO/releases" --jq "[.[] | select(.tag_name == \"$TAG\")] | length" | awk '{s+=$1} END {print s+0}')"
          if [ "$count" -gt 1 ]; then
            echo "::error::$count releases already exist for $TAG. Delete the extras and re-run."
            exit 1
          fi
          if [ "$count" -eq 0 ]; then
            gh release create "$TAG" --draft --title "$TAG" --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" release/* --clobber
