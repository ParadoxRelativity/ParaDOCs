# Cuts a release from a version tag.
#
# Pushing `vX.Y.Z` builds the desktop app on each platform and uploads the
# installers, together with the latest*.yml manifests the auto-updater reads,
# to a DRAFT GitHub Release. Publishing that draft is a deliberate second step,
# because publishing is what makes every installed client start updating.
#
# The same tag builds the mobile apps. The Android APK goes into the same draft
# release: a debug-signed one that sideloads anywhere, or a release-signed one
# (plus an .aab for Google Play) once a keystore is configured. iOS always
# builds for the simulator, which proves the project compiles; with signing
# secrets it also archives an .ipa, kept as a workflow artifact for upload to
# App Store Connect, since an App Store build cannot be installed from a
# release page.
#
# The same tag also builds the server image and pushes it as X.Y.Z, X.Y and
# latest to the GitHub Container Registry (ghcr.io/<owner>/<repo>) and, when
# Docker Hub credentials are configured, to Docker Hub
# (paradoxrelativity/paradocs).
name: Release

on:
  push:
    tags: ['v*']
  # Lets a build be exercised without tagging. Artifacts are still uploaded to a
  # draft, so this is safe to run against main.
  workflow_dispatch:

permissions:
  contents: write # required to create the release

env:
  NODE_VERSION: '20'
  # Whether the tag also builds the iOS and Android apps. Set the repository
  # variable BUILD_MOBILE to false to turn them off without editing this file;
  # it wins over the default here.
  BUILD_MOBILE: 'false'

jobs:
  verify:
    name: Typecheck and version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      mobile: ${{ steps.mobile.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # electron's postinstall downloads the Electron binary from GitHub, which
      # typechecking never runs (the types ship in the npm package) and which
      # fails the whole job whenever that download drops a connection.
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck

      # A tag that disagrees with package.json is the quiet failure worth
      # catching: electron-builder takes the version from package.json, so the
      # release would be named v0.1.2 while latest.yml advertised 0.1.1 and no
      # client would ever see an update.
      - name: Tag matches apps/desktop/package.json
        id: version
        shell: bash
        run: |
          PKG="$(node -p "require('./apps/desktop/package.json').version")"
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$PKG" ]; then
              echo "::error::Tag $TAG does not match apps/desktop/package.json ($PKG)."
              exit 1
            fi
          fi
          # The mobile app is released alongside, under the same number.
          MOBILE="$(node -p "require('./apps/mobile/package.json').version")"
          if [ "$MOBILE" != "$PKG" ]; then
            echo "::error::apps/mobile/package.json ($MOBILE) does not match apps/desktop/package.json ($PKG)."
            exit 1
          fi
          echo "Releasing $PKG"

      # Resolved here because a job's `if:` cannot read `env`, only the outputs
      # of a job it waits for.
      - name: Mobile builds on or off
        id: mobile
        shell: bash
        env:
          OVERRIDE: ${{ vars.BUILD_MOBILE }}
        run: |
          WANTED="${OVERRIDE:-$BUILD_MOBILE}"
          case "$(echo "$WANTED" | tr '[:upper:]' '[:lower:]')" in
            true|yes|1) BUILD=true ;;
            false|no|0) BUILD=false ;;
            *) echo "::error::BUILD_MOBILE is \"$WANTED\"; use true or false."; exit 1 ;;
          esac
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Mobile builds: $BUILD"

  build:
    name: Build ${{ matrix.platform }}
    needs: verify
    strategy:
      # One platform failing should not discard the other's artifacts; re-running
      # the failed job keeps them and goes on to upload both.
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple silicon; builds both arm64 and x64
            platform: macOS
            flag: --mac
          - os: windows-latest
            platform: Windows
            flag: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # electron-builder downloads its own Electron for each target architecture,
      # so the binary electron's postinstall fetches would go unused.
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Build web client
        run: npm run build --workspace=@paradocs/web
      - name: Bundle desktop main process
        run: npm run build --workspace=@paradocs/desktop

      # Signing is optional, but an *empty* CSC_LINK is not the same as an
      # absent one: electron-builder treats the variable as defined, resolves
      # the empty path to the working directory and dies with "not a file".
      # So the signing variables are exported only when a certificate actually
      # exists, and are left genuinely unset otherwise.
      #
      # macOS only. These secrets hold an Apple Developer ID certificate, and
      # electron-builder on Windows reads the same CSC_LINK, so letting this run
      # there would sign the installer with a certificate Windows does not
      # trust. Windows builds unsigned until it has a certificate of its own,
      # which electron-builder takes from WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD.
      - name: Configure signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERT: ${{ secrets.CSC_LINK }}
          CERT_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CERT" ]; then
            echo "No signing certificate configured; building unsigned."
            # Stop electron-builder reaching for some unrelated identity that
            # happens to be on the runner.
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Signing certificate found."
          # Heredoc form: a base64 certificate may span several lines.
          {
            echo "CSC_LINK<<__PARADOCS_EOF__"
            echo "$CERT"
            echo "__PARADOCS_EOF__"
          } >> "$GITHUB_ENV"
          if [ -n "$CERT_PASSWORD" ]; then
            echo "CSC_KEY_PASSWORD=$CERT_PASSWORD" >> "$GITHUB_ENV"
          fi
          if [ -n "$NOTARY_APPLE_ID" ] && [ -n "$NOTARY_PASSWORD" ] && [ -n "$NOTARY_TEAM_ID" ]; then
            echo "APPLE_ID=$NOTARY_APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$NOTARY_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$NOTARY_TEAM_ID" >> "$GITHUB_ENV"
            echo "Notarisation credentials found."
          else
            echo "Notarisation credentials incomplete; skipping notarisation."
          fi

      # Build only; publishing happens once, in the release job. When each
      # platform published itself, both jobs asked GitHub "is there a draft for
      # this tag?" at about the same moment, both heard no, and each created its
      # own draft — splitting macOS and Windows across two releases.
      # electron-builder still writes latest*.yml without publishing, because
      # the publish block in electron-builder.yml is what produces them.
      - name: Build installers
        working-directory: apps/desktop
        run: npx electron-builder ${{ matrix.flag }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml

  android:
    name: Build Android
    needs: verify
    if: needs.verify.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # Capacitor's command line needs Node 22.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3

      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Build web client
        run: npm run build --workspace=@paradocs/web
      - name: Copy it into the Android project
        working-directory: apps/mobile
        run: npx cap sync android

      # The same rule as desktop signing: the keystore is written out, and its
      # variables exported, only when the secret actually exists.
      - name: Configure signing
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "No Android keystore configured; building a debug-signed APK."
            exit 0
          fi
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"
          echo "Signing with the release keystore."

      - name: Build
        working-directory: apps/mobile/android
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/mobile-release"
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew --no-daemon assembleRelease bundleRelease
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/mobile-release/ParaDOCs-$VERSION-android.apk"
            cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/mobile-release/ParaDOCs-$VERSION-android.aab"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/mobile-release/ParaDOCs-$VERSION-android.apk"
          fi
          ls -la "$GITHUB_WORKSPACE/mobile-release"

      # Named like the desktop installers so the release job picks the APK up.
      - uses: actions/upload-artifact@v4
        with:
          name: installers-Android
          if-no-files-found: error
          path: mobile-release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-bundle
          if-no-files-found: ignore
          path: mobile-release/*.aab

  ios:
    name: Build iOS
    needs: verify
    if: needs.verify.outputs.mobile == 'true'
    # Capacitor 8 needs Xcode 26.
    runs-on: macos-26
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Build web client
        run: npm run build --workspace=@paradocs/web
      - name: Copy it into the iOS project
        working-directory: apps/mobile
        run: npx cap sync ios

      # The build number is the version read as digits, as on Android: App
      # Store Connect refuses an upload whose number it has seen before.
      - name: Version
        shell: bash
        run: |
          IFS=.- read -r major minor patch _ <<< "$VERSION"
          echo "BUILD_NUMBER=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_ENV"

      # Proves the project compiles on every release, signing or not.
      - name: Build for the simulator
        working-directory: apps/mobile/ios/App
        run: |
          xcodebuild build \
            -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/simulator" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO
          ditto -c -k --keepParent \
            "$RUNNER_TEMP/simulator/Build/Products/Release-iphonesimulator/App.app" \
            "$GITHUB_WORKSPACE/ParaDOCs-$VERSION-ios-simulator.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          if-no-files-found: error
          path: ParaDOCs-*-ios-simulator.zip

      # A device build needs an Apple Distribution certificate and a
      # provisioning profile for com.paradocs.mobile. These are not the
      # desktop's Developer ID secrets; that certificate cannot sign iOS apps.
      # IOS_EXPORT_METHOD is a repository variable: app-store-connect (the
      # default) for TestFlight and the App Store, or release-testing for
      # ad hoc installs on registered devices.
      - name: Configure signing
        id: signing
        shell: bash
        env:
          CERT: ${{ secrets.IOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'app-store-connect' }}
        run: |
          if [ -z "$CERT" ] || [ -z "$PROFILE" ] || [ -z "$TEAM_ID" ]; then
            echo "iOS signing secrets are not all set; skipping the device build."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A keychain of its own, so the build never reaches for the runner's.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          # Installed under its own UUID, which is also how the export names it.
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_UUID="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -)"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>$EXPORT_METHOD</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>com.paradocs.mobile</key><string>$PROFILE_UUID</string></dict>
          </dict>
          </plist>
          PLIST

          {
            echo "enabled=true"
            echo "profile=$PROFILE_UUID"
            echo "team=$TEAM_ID"
          } >> "$GITHUB_OUTPUT"
          echo "Signing for $EXPORT_METHOD."

      - name: Archive and export
        if: steps.signing.outputs.enabled == 'true'
        working-directory: apps/mobile/ios/App
        run: |
          xcodebuild archive \
            -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${{ steps.signing.outputs.team }}" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="${{ steps.signing.outputs.profile }}"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          cp "$RUNNER_TEMP/export/"*.ipa "$GITHUB_WORKSPACE/ParaDOCs-$VERSION-ios.ipa"

      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          name: ios-ipa
          if-no-files-found: error
          path: ParaDOCs-*-ios.ipa

      - name: Remove signing keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  release:
    name: Upload to draft release
    # Waits for every platform, so a draft never holds half a release. If one
    # platform fails, re-running it re-runs this job too.
    # The APK is part of the release, so Android is waited for too. iOS is not:
    # nothing from it goes on a release page.
    needs: [verify, build, android]
    # A skipped dependency would skip this job with it, and Android is skipped
    # whenever mobile builds are off. So the results are checked by hand, which
    # means `always()` and a failure of either other job stopping this one.
    if: >-
      always()
      && needs.verify.result == 'success'
      && needs.build.result == 'success'
      && (needs.android.result == 'success' || needs.android.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release
          merge-multiple: true

      # An update manifest missing from the release is the other quiet failure:
      # that platform's installed clients would simply never update.
      - name: Check update manifests
        shell: bash
        run: |
          ls -la release
          for f in latest.yml latest-mac.yml; do
            [ -f "release/$f" ] || { echo "::error::release/$f is missing."; exit 1; }
          done

      # The only step that creates a release, so there is exactly one per tag.
      # A draft left by an earlier run of the same version is reused, and
      # --clobber replaces its files, so re-running is safe.
      - name: Create or reuse draft and upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.verify.outputs.version }}
        run: |
          count="$(gh api --paginate "repos/$GH_REPO/releases" --jq "[.[] | select(.tag_name == \"$TAG\")] | length" | awk '{s+=$1} END {print s+0}')"
          if [ "$count" -gt 1 ]; then
            echo "::error::$count releases already exist for $TAG. Delete the extras and re-run."
            exit 1
          fi
          if [ "$count" -eq 0 ]; then
            gh release create "$TAG" --draft --title "$TAG" --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" release/* --clobber

  image:
    name: Server image
    needs: verify
    runs-on: ubuntu-latest
    # Replaces the workflow's permissions for this job only: pushing an image
    # needs packages, and nothing here needs to write to the repository.
    permissions:
      contents: read
      packages: write
    env:
      # The Docker Hub repository the image is pushed to, alongside ghcr.io.
      DOCKERHUB_IMAGE: docker.io/paradoxrelativity/paradocs
    steps:
      - uses: actions/checkout@v4

      # Registry paths must be lowercase, and this repository's name is not.
      #
      # Docker Hub is optional, the same way signing is: a fork, or this
      # repository before its secrets are added, still publishes to ghcr.io
      # rather than failing the release, and the run carries a warning saying
      # Docker Hub was skipped.
      - name: Image names
        id: image
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          names="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            names="$names,$DOCKERHUB_IMAGE"
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
            echo "Publishing to ghcr.io and Docker Hub."
          else
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are not both set, so the image is published to ghcr.io only."
          fi
          echo "names=$names" >> "$GITHUB_OUTPUT"

      # arm64 alongside amd64, for Raspberry Pis, ARM VPSes and the NAS boxes
      # people self-host on. The Dockerfile builds the web client natively and
      # only installs runtime dependencies per architecture, so emulation is
      # confined to the short part of the build.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No registry given means Docker Hub. The token needs Read & Write access.
      - name: Log in to Docker Hub
        if: steps.image.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # A tag produces 1.2.3, 1.2 and latest. A manual run produces only
      # sha-<commit>, so a build can be tried on a test server without moving
      # anything people deploy from. Every tag is applied in each registry, so
      # one build is pushed to both.
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.names }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
          flavor: |
            latest=auto

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
