# Cuts a release from a version tag.
#
# Pushing `vX.Y.Z` builds the desktop app on each platform and uploads the
# installers, together with the latest*.yml manifests the auto-updater reads,
# to a DRAFT GitHub Release. Publishing that draft is a deliberate second step,
# because publishing is what makes every installed client start updating.
name: Release

on:
  push:
    tags: ['v*']
  # Lets a build be exercised without tagging. Artifacts are still uploaded to a
  # draft, so this is safe to run against main.
  workflow_dispatch:

permissions:
  contents: write # required to create the release

env:
  NODE_VERSION: '20'

jobs:
  verify:
    name: Typecheck and version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

      # A tag that disagrees with package.json is the quiet failure worth
      # catching: electron-builder takes the version from package.json, so the
      # release would be named v0.1.2 while latest.yml advertised 0.1.1 and no
      # client would ever see an update.
      - name: Tag matches apps/desktop/package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match apps/desktop/package.json ($PKG)."
            exit 1
          fi
          echo "Releasing $PKG"

  build:
    name: Build ${{ matrix.platform }}
    needs: verify
    strategy:
      # One platform failing should not discard the other's artifacts; the draft
      # can be completed by re-running the failed job.
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple silicon; builds both arm64 and x64
            platform: macOS
            flag: --mac
          - os: windows-latest
            platform: Windows
            flag: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - name: Build web client
        run: npm run build --workspace=@paradocs/web
      - name: Bundle desktop main process
        run: npm run build --workspace=@paradocs/desktop

      # Signing is optional, but an *empty* CSC_LINK is not the same as an
      # absent one: electron-builder treats the variable as defined, resolves
      # the empty path to the working directory and dies with "not a file".
      # So the signing variables are exported only when a certificate actually
      # exists, and are left genuinely unset otherwise.
      - name: Configure signing
        shell: bash
        env:
          CERT: ${{ secrets.CSC_LINK }}
          CERT_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CERT" ]; then
            echo "No signing certificate configured; building unsigned."
            # Stop electron-builder reaching for some unrelated identity that
            # happens to be on the runner.
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Signing certificate found."
          # Heredoc form: a base64 certificate may span several lines.
          {
            echo "CSC_LINK<<__PARADOCS_EOF__"
            echo "$CERT"
            echo "__PARADOCS_EOF__"
          } >> "$GITHUB_ENV"
          if [ -n "$CERT_PASSWORD" ]; then
            echo "CSC_KEY_PASSWORD=$CERT_PASSWORD" >> "$GITHUB_ENV"
          fi
          if [ -n "$NOTARY_APPLE_ID" ] && [ -n "$NOTARY_PASSWORD" ] && [ -n "$NOTARY_TEAM_ID" ]; then
            echo "APPLE_ID=$NOTARY_APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$NOTARY_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$NOTARY_TEAM_ID" >> "$GITHUB_ENV"
            echo "Notarisation credentials found."
          else
            echo "Notarisation credentials incomplete; skipping notarisation."
          fi

      - name: Build installers and upload to draft release
        working-directory: apps/desktop
        run: npx electron-builder ${{ matrix.flag }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
