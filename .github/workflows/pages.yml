# Publishes the apps' privacy policy to GitHub Pages.
#
# apps/web/public/privacy.html is the one copy: it ships in the web build, so
# every server serves it at /privacy.html, and this workflow publishes it at
# https://paradoxrelativity.github.io/ParaDOCs/privacy.html — the address the
# store listings and the apps link to (PRIVACY_POLICY_URL in packages/shared).
#
# Needs Pages turned on once, under Settings → Pages → Build and deployment →
# Source: GitHub Actions.
name: Privacy policy

on:
  push:
    branches: [main]
    paths:
      - apps/web/public/privacy.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a newer edit replaces one still waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}privacy.html
    steps:
      - uses: actions/checkout@v4

      # A policy with no way to contact anyone is worse than none in a store
      # review, so the placeholder never reaches the public address.
      - name: Contact address filled in
        shell: bash
        run: |
          if grep -q 'contact-address-todo' apps/web/public/privacy.html; then
            echo "::error file=apps/web/public/privacy.html::Replace contact-address-todo@example.com with the real contact address before publishing."
            exit 1
          fi

      # The site root sends visitors on to the policy, the only page there is.
      - name: Assemble site
        shell: bash
        run: |
          mkdir _site
          cp apps/web/public/privacy.html apps/web/public/favicon.png _site/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>ParaDOCs</title>
          <meta http-equiv="refresh" content="0; url=privacy.html">
          <a href="privacy.html">ParaDOCs Privacy Policy</a>
          HTML

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
