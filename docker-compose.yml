# ParaDOCs, self-hosted.
#
# This file and a .env beside it are the whole deployment: nothing else from
# the repository is needed. docs/deploying-with-docker.md in the repository
# walks through setting one up.
#
#   docker compose up -d                          # start
#   docker compose pull && docker compose up -d   # upgrade to the latest release
#
# .env must set POSTGRES_PASSWORD and SESSION_SECRET. Both are required on
# purpose: a default password on an internet-facing deployment is not a default,
# it is a vulnerability.
#
# Voice and video are on, with nothing to set. The one thing outside this file
# is the firewall: browsers send call media straight to UDP 7882, or TCP 7881
# where UDP is blocked, so open both. VOICE_ENABLED=false in .env turns voice off.
#
# HTTPS is optional, as a profile switched on in .env:
#
#   COMPOSE_PROFILES=https         Caddy in front, with automatic certificates
#
# Caddy's settings are deliberately not marked required below. Compose checks
# required variables in every service, including ones whose profile is off, so
# a required DOMAIN would stop a deployment without HTTPS. Instead, a missing
# setting shows up in that container's logs.

name: paradocs

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: paradocs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: paradocs
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U paradocs -d paradocs']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Not published: only the app container needs to reach the database.
    expose:
      - '5432'

  app:
    # Published for amd64 and arm64 by each release.
    image: paradoxrelativity/paradocs:latest
    restart: unless-stopped
    # Waiting for a healthy database means the migrations on boot cannot race
    # Postgres still starting up.
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://paradocs:${POSTGRES_PASSWORD}@db:5432/paradocs
      API_PORT: 4000
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      # The API serves the SPA, so requests are same-origin and CORS is unused.
      CORS_ORIGIN: ''
      # Session cookies must be marked Secure once traffic is HTTPS, so set
      # SECURE_COOKIES=true with the https profile. Over plain HTTP leave it
      # false, or nobody stays signed in.
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      # With the https profile and BIND_ADDR=127.0.0.1, set TRUST_PROXY=true so
      # sign-in limits count each person's address rather than Caddy's. Leave
      # it false while the app is published directly, or anyone can claim to
      # be any address.
      TRUST_PROXY: ${TRUST_PROXY:-false}
      UPLOAD_DIR: /data/uploads
      # Largest file anyone can upload, in megabytes: chat, documents and
      # canvases alike. Set for the whole server; workspaces cannot change it.
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      # Whether registration starts open. Once changed on the server admin page,
      # the admin page's setting is used instead.
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      # Whether the server checks GitHub for newer releases and tells server
      # administrators. Set false for a server that should not reach GitHub.
      UPDATE_CHECK: ${UPDATE_CHECK:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # The server admin page: server-wide settings and every account. It has
      # its own port, published below on loopback only.
      ADMIN_ENABLED: ${ADMIN_ENABLED:-true}
      ADMIN_PORT: 4001
      ADMIN_HOST: 0.0.0.0
      # Voice and video. On first start the app writes the key pair LiveKit
      # uses into a volume both containers share, and it relays LiveKit's
      # signalling under /rtc on its own address, so browsers reach voice
      # wherever they reach the app. Nothing here needs setting.
      VOICE_ENABLED: ${VOICE_ENABLED:-true}
      LIVEKIT_INTERNAL_URL: ${LIVEKIT_INTERNAL_URL:-http://livekit:7880}
      LIVEKIT_KEY_FILE: /data/voice/keys.yaml
      # Optional: fixed keys instead of generated ones.
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      # Optional: a LiveKit server browsers reach directly, instead of through
      # the app.
      LIVEKIT_URL: ${LIVEKIT_URL:-}
    volumes:
      - uploads:/data/uploads
      - voice-keys:/data/voice
    # Bound to every interface by default so a fresh install is reachable.
    # With the https profile, set BIND_ADDR=127.0.0.1 so only Caddy reaches it.
    #
    # The server admin page is published on 127.0.0.1 only, so it is never on
    # the internet. Reach it from elsewhere through an SSH tunnel:
    #   ssh -L 4001:127.0.0.1:4001 you@server   then open http://localhost:4001
    ports:
      - '${BIND_ADDR:-0.0.0.0}:${PORT:-4000}:4000'
      - '${ADMIN_BIND_ADDR:-127.0.0.1}:${ADMIN_PORT:-4001}:4001'
    # Reap orphaned processes; tini in the image handles signals.
    init: true

  # HTTPS, with the `https` profile. Caddy terminates TLS and obtains and renews
  # certificates by itself. Point DOMAIN's A/AAAA record at this host before
  # starting it, or the certificate order fails.
  caddy:
    image: caddy:2-alpine
    profiles: ['https']
    restart: unless-stopped
    depends_on:
      - app
    environment:
      # The hostname Caddy serves and gets a certificate for.
      DOMAIN: ${DOMAIN:-}
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - '80:80'
      - '443:443'

  # Voice, video and screen sharing.
  #
  # Signalling reaches this container through the app, so its signalling port
  # is not published. Media cannot go through an HTTP proxy, so its media ports
  # are: browsers send audio and video to them directly.
  livekit:
    image: livekit/livekit-server:v1.13.6
    restart: unless-stopped
    # The app writes the key file on its first start.
    depends_on:
      app:
        condition: service_healthy
    # LiveKit has to tell browsers the address to send media to. By default it
    # asks a public STUN server what this host's address looks like from the
    # internet. LIVEKIT_NODE_IP names the address instead, for hosts where that
    # answer is wrong or cannot be had, such as a server on a private network.
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        if [ -n "$$LIVEKIT_NODE_IP" ]; then
          sed 's/use_external_ip: true/use_external_ip: false/' /etc/livekit.yaml > /tmp/livekit.yaml
          exec /livekit-server --config /tmp/livekit.yaml --node-ip "$$LIVEKIT_NODE_IP"
        fi
        exec /livekit-server --config /etc/livekit.yaml
    environment:
      LIVEKIT_NODE_IP: ${LIVEKIT_NODE_IP:-}
    configs:
      - source: livekit
        target: /etc/livekit.yaml
    volumes:
      - voice-keys:/keys:ro
    ports:
      # UDP carries every call's media on one port. The numbers must match the
      # rtc ports in the livekit config below, because those numbers are what
      # browsers are told.
      - '7882:7882/udp'
      # TCP is the fallback for networks that block UDP. It is no more exposed
      # than the UDP port: nothing is accepted without connection details handed
      # out over the authenticated signalling connection, and the media on it is
      # encrypted.
      - '7881:7881'

# Configuration files, written into the containers that use them. Compose
# substitutes ${...} variables in this text, so a literal $ is written $$.
configs:
  caddyfile:
    content: |
      {$$DOMAIN} {
        encode zstd gzip

        # Everything is the app: the SPA, /api, /uploads, and the collaboration,
        # chat and voice signalling websockets, which reverse_proxy passes through.
        reverse_proxy app:4000
      }

  livekit:
    content: |
      port: 7880

      # Written by the app, which shares the same keys.
      key_file: /keys/keys.yaml

      # Tells the app as people join and leave, so everyone's channel list shows
      # who is in a voice channel straight away. Signed with the shared key:
      # the one set in .env, or the generated one, which is named paradocs.
      webhook:
        api_key: ${LIVEKIT_API_KEY:-paradocs}
        urls:
          - http://app:4000/api/voice/webhook

      rtc:
        # Media over TCP, for networks that block UDP. Networks that allow only
        # web traffic need TURN over TLS instead, which is not enabled here; see
        # docs/voice-turn.md in the repository.
        tcp_port: 7881
        # Every call's media arrives on this one UDP port, and LiveKit tells
        # callers apart by their address, so there is nothing to run out of and
        # one firewall rule covers every call.
        udp_port: 7882
        # Find the public address through STUN. Turned off when LIVEKIT_NODE_IP
        # gives the address instead; see the livekit service above.
        use_external_ip: true

      # Rooms are created when the first person joins and disappear once the
      # last one leaves, which is why an empty voice channel costs nothing.
      room:
        auto_create: true
        empty_timeout: 60

      logging:
        level: info

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
  voice-keys:
